# NovaDesk — interface client Flutter (plan 10).
# L'UI est « mince » : toute la logique réseau/crypto/média vit dans le cœur Rust
# (workspace ../, façade `crates/nd-ffi`), relié via flutter_rust_bridge.
name: novadesk_ui
description: Interface Flutter de NovaDesk — bureau à distance piloté par un cœur Rust.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Localisations Material/Cupertino (l'UI v1 est en français ; catalogues ARB à venir).
  flutter_localizations:
    sdk: flutter
  # Gestion d'état : providers composables, `family`/`autoDispose` calqués sur le
  # cycle de vie d'une session (choix argumenté au plan 10 §10.2.3).
  flutter_riverpod: ^2.6.1
  # Pont Dart <-> Rust : runtime du binding généré depuis `crates/nd-ffi`
  # (voir lib/bridge/README.md pour la génération).
  flutter_rust_bridge: ^2.9.0
  # Annotations freezed : le binding FRB généré modélise les enums Rust à
  # variantes porteuses (ex. InputEventDto) en classes scellées freezed.
  freezed_annotation: ^2.4.4
  lucide_icons_flutter: ^3.1.14+2
  # Gestion de **fenêtre native réelle** (remplace la façade no-op
  # `lib/platform/window_shim.dart`) : minimiser/agrandir/restaurer/fermer,
  # plein écran, déplacement par la barre de titre custom (`titleBarStyle:
  # hidden`). Plugin natif desktop — compile grâce aux droits admin (support des
  # liens symboliques Windows).
  window_manager: ^0.4.3
  # Rendu vidéo par **texture GPU** : accès au *handle* du moteur Flutter
  # (`IrondashEngineContext.getEngineHandle`) transmis au cœur Rust (`nd-ffi`),
  # qui crée une `Texture` PixelBuffer alimentée par les frames de session (voir
  # `lib/platform/texture_video.dart` + `crates/nd-ffi/src/texture.rs`). Version
  # alignée sur la crate Rust homonyme (0.5.x). Plugin natif desktop.
  irondash_engine_context: ^0.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Génération du code freezed (classes scellées) + moteur build_runner,
  # requis par `flutter_rust_bridge_codegen generate`.
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
