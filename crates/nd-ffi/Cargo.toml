[package]
name = "nd-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pont entre le cœur Rust et l'UI Flutter via flutter_rust_bridge (voir plan 10)."

# `cdylib` : bibliothèque dynamique (nd_ffi.dll / .so / .dylib) chargée par
# l'app Flutter via `RustLib.init()`. `lib` (rlib) : conserve nd-ffi utilisable
# comme dépendance normale du workspace et pour ses tests.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nd-proto = { workspace = true }
nd-core = { workspace = true }
# Nécessaire à la façade UI : `SessionConfig` embarque `nd_features::Permissions`.
nd-features = { workspace = true }
# Session live : `SessionHandle.frame_rx` transporte des `nd_codec::DecodedFrame`.
nd-codec = { workspace = true }
# Session live : l'endpoint `Loopback` lie l'écouteur QUIC côté façade.
nd-transport = { workspace = true }
# Session média étendue : injection d'une `AudioSession` système dans `SessionMedia`.
nd-audio = { workspace = true }
# Session média étendue : `TransferEvent` (canal `Files`) et `ClipboardSync`
# (presse-papiers injecté dans `SessionMedia`) viennent de nd-files.
nd-files = { workspace = true }
# État applicatif persistant (lot « état réel ») : identité locale stable via
# `nd_crypto::IdentityStore::load_or_create` + empreinte `PeerFingerprint`.
nd-crypto = { workspace = true }
# Persistance pur Rust : JSON atomique (sérialisation des DTO plats de la façade).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hachage salé du mot de passe d'accès non surveillé (jamais stocké en clair) —
# même primitive que `nd-features`/`nd-files`.
blake3 = "1"
# Pont Dart <-> Rust. Version alignée sur le paquet Dart `flutter_rust_bridge`
# résolu dans ui/pubspec.lock (2.12.0) : codegen, crate runtime et paquet Dart
# doivent partager la même version.
flutter_rust_bridge = "=2.12.0"

[dev-dependencies]
# Répertoires temporaires uniques pour les tests de persistance (round-trips,
# réouverture depuis disque).
tempfile = "3"
# Relecture d'enregistrement : fabrication d'un vrai MP4 H.264 dans les tests
# (image synthétique `CapturedFrame` → encodeur `nd-codec` → muxeur
# `nd-features`), afin d'exercer `open_recording`/`recording_next_frame` de bout
# en bout. Uniquement pour les tests — pas une dépendance de la façade.
nd-capture = { workspace = true }

[lints]
workspace = true
