[package]
name = "nd-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pont entre le cœur Rust et l'UI Flutter via flutter_rust_bridge (voir plan 10)."

# `cdylib` : bibliothèque dynamique (nd_ffi.dll / .so / .dylib) chargée par
# l'app Flutter via `RustLib.init()`. `lib` (rlib) : conserve nd-ffi utilisable
# comme dépendance normale du workspace et pour ses tests.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nd-proto = { workspace = true }
nd-core = { workspace = true }
# Nécessaire à la façade UI : `SessionConfig` embarque `nd_features::Permissions`.
nd-features = { workspace = true }
# Session live : `SessionHandle.frame_rx` transporte des `nd_codec::DecodedFrame`.
nd-codec = { workspace = true }
# Session live : l'endpoint `Loopback` lie l'écouteur QUIC côté façade.
nd-transport = { workspace = true }
# Session média étendue : injection d'une `AudioSession` système dans `SessionMedia`.
nd-audio = { workspace = true }
# Session média étendue : `TransferEvent` (canal `Files`) et `ClipboardSync`
# (presse-papiers injecté dans `SessionMedia`) viennent de nd-files.
nd-files = { workspace = true }
# État applicatif persistant (lot « état réel ») : identité locale stable via
# `nd_crypto::IdentityStore::load_or_create` + empreinte `PeerFingerprint`.
nd-crypto = { workspace = true }
# « Internet par ID » : acquisition d'un NovaId + jeton d'enregistrement signé
# auprès de nd-api (`ApiClient::allocate_id`) au premier lancement.
nd-api = { path = "../../server/nd-api" }
# « Internet par ID » : clé de signature Ed25519 (`auth::SigningKey`) persistée
# et enregistrement authentifié au rendez-vous (`register_authentifie`).
nd-signaling = { workspace = true }
# Persistance pur Rust : JSON atomique (sérialisation des DTO plats de la façade).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hachage salé du mot de passe d'accès non surveillé (jamais stocké en clair) —
# même primitive que `nd-features`/`nd-files`.
blake3 = "1"
# Pont Dart <-> Rust. Version alignée sur le paquet Dart `flutter_rust_bridge`
# résolu dans ui/pubspec.lock (2.12.0) : codegen, crate runtime et paquet Dart
# doivent partager la même version.
flutter_rust_bridge = "=2.12.0"
# Rendu vidéo par **TEXTURE GPU** (plan « texture ») : pont Rust ↔ registre de
# textures Flutter. `irondash_texture` crée une texture PixelBuffer alimentée
# depuis le cœur (upload CPU→GPU par Flutter) ; `irondash_engine_context` relie
# la texture au moteur Flutter via le handle passé par le Dart
# (`IrondashEngineContext.getEngineHandle`). Versions alignées sur les paquets
# Dart homonymes de `ui/pubspec.yaml` (0.5.x). Le chemin RGBA-CPU historique
# (`decodeImageFromPixels`) reste le repli quand la texture échoue.
irondash_texture = "0.5"
irondash_engine_context = "0.5"

# Durcissement du stockage local **sans droits administrateur** (module `plateforme`) :
#   * chiffrement des secrets au repos via DPAPI (`CryptProtectData`/`CryptUnprotectData`,
#     portée utilisateur) — clé privée d'identité et haché du mot de passe non surveillé ;
#   * démarrage automatique via la clé `Run` de l'utilisateur courant
#     (`HKCU\Software\Microsoft\Windows\CurrentVersion\Run`).
# Spécifique à Windows (repli documenté « clair » hors Windows, cf. `plateforme`).
# Version alignée sur nd-capture (0.58) pour ne pas dédoubler la dépendance.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
] }

[dev-dependencies]
# Répertoires temporaires uniques pour les tests de persistance (round-trips,
# réouverture depuis disque).
tempfile = "3"
# Relecture d'enregistrement : fabrication d'un vrai MP4 H.264 dans les tests
# (image synthétique `CapturedFrame` → encodeur `nd-codec` → muxeur
# `nd-features`), afin d'exercer `open_recording`/`recording_next_frame` de bout
# en bout. Uniquement pour les tests — pas une dépendance de la façade.
nd-capture = { workspace = true }
# Test d'intégration « Internet par ID » (tests/internet_par_id.rs) : monte la
# vraie façade authentifiée du rendez-vous de production en process pour prouver
# que l'enregistrement authentifié de l'hôte est accepté et l'ID résolvable.
# Cycle de DEV toléré (comme crates/nd-signaling/tests/register_authentifie.rs).
nd-rendezvous = { path = "../../server/nd-rendezvous" }

[lints]
workspace = true
