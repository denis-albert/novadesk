[package]
name = "nd-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Injection d'entrées clavier/souris/tactile par OS (voir plan 07)."

[dependencies]
nd-proto = { workspace = true }

# Implémentation Windows : injection clavier/souris via SendInput (windows-rs),
# séquence d'attention sécurisée (SendSAS) et injection tactile (InjectTouchInput).
# Win32_Graphics_Gdi : énumération multi-écran (EnumDisplayMonitors/GetMonitorInfoW)
# pour honorer le paramètre moniteur dans mouse_move_abs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Authentication_Identity",
] }

# Implémentation macOS : injection via Quartz Event Services (CGEventPost).
# Nécessite la permission Accessibilité (TCC) côté machine contrôlée — voir macos.rs.
# La feature `highsierra` expose CGEventCreateScrollWheelEvent2 (molette 2 axes,
# macOS >= 10.13), utilisée par `scroll()`.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

# Implémentation Linux : injection via l'extension XTEST de X11 (x11rb, Rust pur,
# sans bibliothèque C) sur X11/XWayland ; en session Wayland pure, injection au
# niveau noyau via /dev/uinput (libc, Rust pur également — pas de dépendance C à
# lier). La feature `randr` fournit les rectangles par moniteur (multi-écran).
# Le portail RemoteDesktop + libei reste la voie « intégrée bureau » à venir
# (voir uinput.rs). Aucune de ces dépendances ne lie de bibliothèque C : le code
# Linux se vérifie en compilation croisée depuis Windows.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr"] }
libc = "0.2"

[lints]
workspace = true
