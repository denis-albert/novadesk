[package]
name = "nd-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Capture et lecture audio, codec Opus, synchro A/V (voir plan 08)."

[dependencies]
nd-proto = { workspace = true }
# Codec Opus : FFI vers libopus 1.5 vendoré (lien statique, build cmake ≥ 3.16).
# Choisi plutôt que `opus`/`audiopus` dont le libopus embarqué (2018) est
# rejeté par CMake ≥ 4. L'enveloppe sûre est dans `src/codec.rs`.
libopus_sys = "0.4"

# Implémentation Windows : boucle de retour (loopback) WASAPI via windows-rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
] }

# Implémentation Linux : PulseAudio « simple API » (flux synchrones bloquants),
# la plus directe pour un premier jet. Le loopback système passe par la source
# *monitor* du périphérique de sortie par défaut (`@DEFAULT_MONITOR@`) ; les
# distributions PipeWire exposent la même API via pipewire-pulse — voir plan 08
# §Linux. Nécessite libpulse côté système (paquet libpulse-dev à la compilation).
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

# Implémentation macOS : rendu CoreAudio (AudioUnit « default output » +
# rappel de rendu) via coreaudio-rs ; capture de l'audio système (macOS 13+) via
# ScreenCaptureKit (SCStream audio) au travers des bindings objc2. Voir
# src/macos.rs. NOTE : nd-audio ne compile pas en cible croisée depuis Windows
# (libopus_sys se construit via CMake/MSVC, incompatible arm64-apple) — ce code
# macOS est vérifié par résolution des dépendances + revue, à valider sur macOS.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.12"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
# `objc2-core-audio-types` : expose CMSampleBuffer::audio_buffer_list_with_retained_block_buffer.
objc2-core-media = { version = "0.3", features = ["objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
# `CFRetained` pour libérer le CMBlockBuffer retourné par l'extraction audio.
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[lints]
workspace = true
