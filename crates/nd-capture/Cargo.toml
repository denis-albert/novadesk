[package]
name = "nd-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Capture d'écran : trait ScreenCapturer et implémentations par OS (voir plan 02)."

[features]
# Backend Wayland : PipeWire + portail xdg-desktop-portal ScreenCast.
# **Désactivé par défaut** : il lie `libpipewire` (bibliothèque C, via le crate
# `pipewire`) et n'est donc PAS vérifiable en compilation croisée depuis Windows —
# le build/cross-check par défaut reste 100 % Rust (X11 via x11rb). À activer et
# valider sur un vrai Linux Wayland (paquets `libpipewire-0.3-dev` + portail).
# Fonction spécifique à Linux (les dépendances ci-dessous sont sous `cfg(linux)`).
wayland-pipewire = ["dep:ashpd", "dep:pipewire", "dep:pollster"]

[dependencies]
nd-proto = { workspace = true }

# Implémentation Windows : DXGI Desktop Duplication + forme du curseur (GDI) via windows-rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Requis par DXGI_OUTPUT_DESC (HMONITOR) pour l'énumération des moniteurs,
    # et par la capture de la forme du curseur (GetDIBits/BITMAPINFO, voir win_cursor).
    "Win32_Graphics_Gdi",
    # Requis par la capture de la forme du curseur (GetCursorInfo/GetIconInfo).
    "Win32_UI_WindowsAndMessaging",
] }

# Implémentation macOS : capture CoreGraphics (CGDisplayCreateImage) + énumération
# des écrans (CGGetActiveDisplayList). Le passage à ScreenCaptureKit (flux poussé,
# zéro-copie) est prévu dans un jet ultérieur — voir plan 02 §macOS.
# (`core-foundation` arrive transitivement ; pas besoin d'une dépendance directe.)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

# Implémentation Linux : capture X11 (GetImage) + énumération RandR via x11rb
# (Rust pur, sans bibliothèque C), backend par défaut. Le backend Wayland
# (PipeWire + portail) est optionnel — voir la fonction `wayland-pipewire`.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
# Backend Wayland optionnel (fonction `wayland-pipewire`). `ashpd` (portail
# xdg-desktop-portal, Rust pur sur zbus) négocie la session ScreenCast ; `pipewire`
# (lie `libpipewire`, bibliothèque C ; ré-exporte `libspa` sous `pipewire::spa`)
# consomme le flux ; `pollster` fait le pont async→bloquant. Non compilés tant que la
# fonction n'est pas activée.
ashpd = { version = "0.13", optional = true }
pipewire = { version = "0.10", optional = true }
pollster = { version = "0.4", optional = true }

[lints]
workspace = true
