[package]
name = "nd-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Capture d'écran : trait ScreenCapturer et implémentations par OS (voir plan 02)."

[dependencies]
nd-proto = { workspace = true }

# Implémentation Windows : DXGI Desktop Duplication + forme du curseur (GDI) via windows-rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Requis par DXGI_OUTPUT_DESC (HMONITOR) pour l'énumération des moniteurs,
    # et par la capture de la forme du curseur (GetDIBits/BITMAPINFO, voir win_cursor).
    "Win32_Graphics_Gdi",
    # Requis par la capture de la forme du curseur (GetCursorInfo/GetIconInfo).
    "Win32_UI_WindowsAndMessaging",
] }

# Implémentation macOS : capture CoreGraphics (CGDisplayCreateImage) + énumération
# des écrans (CGGetActiveDisplayList). Le passage à ScreenCaptureKit (flux poussé,
# zéro-copie) est prévu dans un jet ultérieur — voir plan 02 §macOS.
# (`core-foundation` arrive transitivement ; pas besoin d'une dépendance directe.)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

# Implémentation Linux : capture X11 (GetImage) + énumération RandR via x11rb
# (Rust pur, sans bibliothèque C). Wayland (PipeWire + portail) : jet ultérieur,
# voir plan 02 §Linux.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[lints]
workspace = true
