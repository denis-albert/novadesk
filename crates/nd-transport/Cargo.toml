[package]
name = "nd-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Transport temps réel : canaux logiques sur QUIC, FEC (voir plan 04)."

[dependencies]
nd-proto = { workspace = true }
# Transport QUIC (UDP + TLS 1.3). Voir plan 04. La sécurité de bout en bout (Noise)
# viendra par-dessus (plan 06) ; ici QUIC assure le chiffrement de saut et le multiplexage.
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
# FEC par effacement (Reed-Solomon) pour la vidéo/audio sur datagrammes non fiables.
# Rust pur (pas de feature `simd-accel`) : portable, suffisant pour nos tailles de trames.
reed-solomon-erasure = "6"
# Tampons partagés : `quinn::Connection::send_datagram` prend un `bytes::Bytes`.
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
# Vérification (et signature côté émetteur/tests) des tickets de relais signés
# Ed25519. Le format est aligné sur `server/nd-api` (auth.rs, lot 07), source de
# vérité : on ne dépend pas du serveur (graphe à l'envers, poids), on duplique la
# structure de vérification minimale — voir `src/ticket.rs`.
ed25519-dalek = "2"

[lints]
workspace = true
