[package]
name = "nd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Orchestration de session NovaDesk : machine à états, assemblage du pipeline."

[dependencies]
nd-proto = { workspace = true }
nd-capture = { workspace = true }
nd-codec = { workspace = true }
nd-input = { workspace = true }
nd-transport = { workspace = true }
nd-crypto = { workspace = true }
nd-features = { workspace = true }
# Résolution par ID (SessionEndpoint::ByRendezvous du moteur de session).
nd-signaling = { workspace = true }
# Briques « prêtes pour la session » câblées dans la boucle média (lot 05) :
# audio système (canal Audio), transfert de fichiers + presse-papiers (canaux
# Fichiers / Contrôle-annexe).
nd-audio = { workspace = true }
nd-files = { workspace = true }

[dev-dependencies]
# Fenêtre de démonstration (viewer). L'UI définitive sera en Flutter (voir plan 10).
minifb = "0.27"

[lints]
workspace = true
