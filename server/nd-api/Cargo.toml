[package]
name = "nd-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "API applicative : carnet d'adresses, licences, mises à jour. Voir plan 11/15."

[dependencies]
nd-proto = { workspace = true }
# Persistance légère (storage.rs) : état JSON écrit de façon atomique.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Autorité de signature (auth.rs) : jetons applicatifs, jetons d'enregistrement
# d'ID et tickets de relais — Ed25519 pur Rust (plan 11).
ed25519-dalek = "2"
# Encodage hexadécimal des clés et jetons (pur Rust, déjà dans l'arbre).
hex = "0.4"
# Graine aléatoire des clés éphémères et de la permutation d'IDs (allocation.rs).
getrandom = { version = "0.3", features = ["std"] }
# Fonction de ronde (PRF) de la permutation d'IDs (allocation.rs) — pur Rust.
sha2 = "0.10"

# Test d'intégration bout-en-bout (tests/chaine_rendezvous.rs) : monte le vrai
# serveur de rendez-vous de production (server/nd-rendezvous) et son client
# (nd-signaling) en process, pour prouver que le jeton d'enregistrement émis par
# l'attribution d'ID de nd-api est accepté par la façade authentifiée. Le cycle
# nd-rendezvous → nd-api est toléré : une dépendance de dev peut être cyclique
# (elle ne pèse pas sur le graphe d'exécution) — même motif que
# crates/nd-signaling/tests/register_authentifie.rs.
[dev-dependencies]
nd-rendezvous = { path = "../nd-rendezvous" }
nd-signaling = { workspace = true }

[lints]
workspace = true
