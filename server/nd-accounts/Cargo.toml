[package]
name = "nd-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Service comptes / authentification (OAuth2/OIDC, 2FA). Voir plan 11."

[dependencies]
nd-proto = { workspace = true }
# Hachage de mots de passe Argon2id (format PHC). La feature `std` active
# `rand_core/getrandom`, nécessaire à `OsRng` (sels et jetons aléatoires).
argon2 = { version = "0.5", features = ["std"] }
# 2FA TOTP (RFC 6238) : HMAC-SHA1 pur Rust, dépendances légères (src/totp.rs).
hmac = "0.12"
sha1 = "0.10"
# Persistance fichier des comptes : document JSON versionné, écriture atomique
# (fichier temporaire + rename) — pur Rust, pas de SQLite C (src/storage.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fédération OIDC : défi PKCE S256 (SHA-256) et vérification HS256 des ID
# tokens JWT (src/oidc.rs). `hmac` ci-dessus sert aussi à HMAC-SHA256.
sha2 = "0.10"

[lints]
workspace = true
