[package]
name = "nd-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Service comptes / authentification (OAuth2/OIDC, 2FA). Voir plan 11."

[dependencies]
nd-proto = { workspace = true }
# Hachage de mots de passe Argon2id (format PHC). La feature `std` active
# `rand_core/getrandom`, nécessaire à `OsRng` (sels et jetons aléatoires).
argon2 = { version = "0.5", features = ["std"] }
# 2FA TOTP (RFC 6238) : HMAC-SHA1 pur Rust, dépendances légères (src/totp.rs).
hmac = "0.12"
sha1 = "0.10"
# Persistance fichier des comptes : document JSON versionné, écriture atomique
# (fichier temporaire + rename) — pur Rust, pas de SQLite C (src/storage.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fédération OIDC : défi PKCE S256 (SHA-256) et vérification HS256 des ID
# tokens JWT (src/oidc.rs). `hmac` ci-dessus sert aussi à HMAC-SHA256.
# La feature `oid` fournit l'OID de SHA-256 exigé par le préfixe DigestInfo
# de RSASSA-PKCS1-v1_5 (`rsa::pkcs1v15`, RS256).
sha2 = { version = "0.10", features = ["oid"] }
# Vérification asymétrique des ID tokens (src/jwks.rs) : RS256 (RSASSA-PKCS1
# v1.5 / SHA-256) et ES256 (ECDSA P-256 / SHA-256) — crates RustCrypto pur
# Rust, comme documenté au point d'extension de src/oidc.rs.
rsa = "0.9"
p256 = "0.13"
# Client HTTP bloquant + TLS (rustls/ring, déjà compilés dans l'arbre) :
# récupération des JWKS et échange code→jetons au token endpoint.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Persistance : base clé/valeur transactionnelle **pur Rust** (ACID, fichier
# unique) — remplace le document JSON de storage.rs. Choisie plutôt que
# rusqlite (lib C) pour rester compilable sans chaîne C complète.
redb = "2"
# Chiffrement au repos des secrets TOTP (AEAD ChaCha20-Poly1305, clé dérivée
# du secret serveur) — déjà présent dans Cargo.lock via nd-crypto.
chacha20poly1305 = "0.10"
# Jetons applicatifs signés Ed25519 (src/jeton.rs), vérifiables par nd-api ;
# réutilise curve25519-dalek déjà présent dans Cargo.lock.
ed25519-dalek = "2"

[lints]
workspace = true
